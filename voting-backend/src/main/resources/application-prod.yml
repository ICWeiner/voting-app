spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:db.example.com}:${DB_PORT:5432}/${POSTGRES_DB} # TODO need to set this correctly
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Flyway will look for migrations in src/main/resources/db/migration
    locations: classpath:db/migration

logging:
  level:
    root: INFO

server:
  port: 8080