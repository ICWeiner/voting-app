spring:
  application:
    name: apostas

  config:
    import: optional:file:.env[.properties]

  jackson:
    time-zone: Europe/Lisbon

server:
  port: 8000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_DURATION_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: "*"