spring:
  application:
    name: apostas

  config:
    import: optional:file:.env[.properties]

  jackson:
    time-zone: Europe/Lisbon

server:
  port: 8000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_DURATION_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  level:
    com.joker.apostas: DEBUG